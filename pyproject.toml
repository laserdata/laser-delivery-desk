[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-delivery-desk"
version = "0.1.0"
description = "A delivery operations desk on Laser SDK: a live courier map, exception workflows and an invoice check"
requires-python = ">=3.11"
dependencies = [
  "laser-sdk==0.8.2",
  "aiohttp>=3.9",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.setuptools]
packages = ["fleet"]

[tool.setuptools.package-data]
fleet = ["static/*"]
